<svg xmlns="http://www.w3.org/2000/svg" width="420" height="330" viewBox="0 0 420 330">
<rect width="420" height="330" fill="white"/>
<text x="210" y="25" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#0d47a1">Net of a square-based pyramid</text>
<g transform="translate(150,100)" stroke="#333" stroke-width="2" fill="#e3f2fd">
<rect x="0" y="0" width="120" height="120" fill="#fff"/>
<polygon points="0,0 120,0 60,-80"/><polygon points="120,0 120,120 200,60"/><polygon points="0,120 120,120 60,200"/><polygon points="0,0 0,120 -80,60"/>
</g>
<g font-family="Segoe UI,Arial" font-size="15" fill="#333"><text x="210" y="235" text-anchor="middle">square side = 6 cm</text><text x="210" y="260" text-anchor="middle">triangle height = 4 cm</text></g>
</svg>